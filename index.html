<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マダミス・ノート</title><style>:root{--bg:#fffaf2;--card:#fff;--line:#eadfce;--text:#40362f;--muted:#8a7d72;--accent:#f0a45b;--accent2:#f7cf72;--danger:#d86a6a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:9px 12px;cursor:pointer;box-shadow:0 2px 6px #0000000a}button:active{transform:translateY(1px)}header{position:sticky;top:0;z-index:20;background:#fffdf9;border-bottom:1px solid var(--line);padding:10px env(safe-area-inset-right) 9px env(safe-area-inset-left);box-shadow:0 2px 10px #0000000a}.headrow{display:flex;gap:8px;align-items:center;padding:0 10px}.title{font-weight:900;white-space:nowrap;letter-spacing:.02em}.status{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.workbar{display:flex;gap:7px;margin:8px 10px 0;overflow-x:auto;padding-bottom:2px}.workbar button{white-space:nowrap}.workbar .active{background:var(--accent);color:#fff;border-color:var(--accent)}.layout{max-width:1400px;margin:auto;padding:12px}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px}.tab{display:flex;align-items:center;gap:4px;white-space:nowrap}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{min-width:0}.view{display:none}.view.active{display:block}h2{font-size:20px;margin:5px 0 12px;font-weight:900}.hint{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px;margin-bottom:10px;box-shadow:0 3px 12px #00000008}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tablewrap{overflow:auto;border-radius:18px;border:1px solid var(--line);background:#fff}.tablewrap table{border-collapse:separate;border-spacing:0;width:max(100%,900px);background:#fff}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;vertical-align:top}th{background:#fff5e8;font-size:12px;position:sticky;top:0;z-index:1}td[contenteditable]{min-width:90px;outline:none}td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--accent2);background:#fffdf7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}.character h3{margin:0;font-size:17px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.grow{flex:1}label{display:block;font-size:12px;color:#75675d;margin:7px 0 4px}input,textarea,select{border:1px solid #ded2c3;border-radius:14px;padding:9px;background:#fffdf9;width:100%;color:var(--text);outline:none}textarea{min-height:90px;resize:vertical}.danger{color:var(--danger)}.mini{font-size:11px;color:var(--muted)}details{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}summary{padding:11px;font-weight:800;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.detailsbody{padding:0 11px 11px}.badge{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#fff0d9;margin-right:4px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cdbfaf;border-radius:18px;background:#fffdf9}@media(max-width:650px){select{min-height:40px}header{padding-left:0;padding-right:0}.title{font-size:14px}.status{display:none}.layout{padding:8px}.card{padding:10px;border-radius:18px}.grid{grid-template-columns:1fr}h2{font-size:18px}.toolbar button{padding:8px 10px}.tabs{margin-bottom:7px}th,td{padding:6px;font-size:12px}}</style></head><body><header><div class="headrow"><div class="title">🕵️ マダミス・ノート</div><div class="status" id="status">自動保存</div></div><div class="workbar"><button onclick="newWork()">＋ 作品</button><button onclick="renameWork()">作品名変更</button><button onclick="deleteWork()" class="danger">作品削除</button><button onclick="exportAll()">バックアップ</button><label style="margin:0;white-space:nowrap"><button onclick="document.getElementById('importFile').click()">復元</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importAll(event)"></label></div><div class="tabs" id="workTabs"></div></header><div class="layout"><div class="tabs" id="viewTabs"><button class="tab active" onclick="showView('timeline',this)">📅 全体時系列</button><button class="tab" onclick="showView('characters',this)">👤 キャラ</button><button class="tab" onclick="showView('evidence',this)">🔎 証拠・推理</button></div><main><section id="timeline" class="view active"><h2>全体時系列</h2><div class="toolbar"><button onclick="addTimeline()">＋ 時系列を追加</button><span class="hint">時間は5分刻み。人物・証言者は後から変更でき、キャラ別時系列にも反映されます。</span></div><div class="card tablewrap"><table id="timelineTable"><thead><tr><th>順番</th><th>時間・日付</th><th>場所</th><th>人物</th><th>出来事</th><th>情報源・証言者</th><th>確度</th><th>メモ</th><th>削除</th></tr></thead><tbody></tbody></table></div></section><section id="characters" class="view"><h2>キャラクター</h2><div class="toolbar"><button onclick="addCharacter()">＋ キャラを追加</button><span class="hint">人物の関係性・時系列・証拠・自由メモをまとめて管理。</span></div><div id="charactersGrid" class="grid"></div></section><section id="evidence" class="view"><h2>証拠・推理メモ</h2><div class="toolbar"><button onclick="addEvidence()">＋ メモを追加</button><span class="hint">証拠・発言・推理・疑問を折りたたんで整理。</span></div><div id="evidenceList"></div></section></main></div><script>const KEY="murder_mystery_notebook_v2";let all=JSON.parse(localStorage.getItem(KEY)||'{"works":{},"current":null}'),current=null;function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function freshWork(name){return{name,characters:[],timeline:[],evidence:[]}}function ensure(){if(!all.works||typeof all.works!=="object")all={works:{},current:null};let ids=Object.keys(all.works);if(!ids.length){let id=uid();all.works[id]=freshWork("新しいマダミス");all.current=id}else if(!all.current||!all.works[all.current])all.current=ids[0];current=all.works[all.current]}function save(){localStorage.setItem(KEY,JSON.stringify(all));document.getElementById("status").textContent="保存済み "+new Date().toLocaleTimeString()}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function renderWorkTabs(){let el=document.getElementById("workTabs");el.innerHTML="";Object.entries(all.works).forEach(([id,w])=>{let b=document.createElement("button");b.className="tab"+(id===all.current?" active":"");b.textContent=w.name;b.onclick=()=>{all.current=id;current=w;save();renderAll()};el.appendChild(b)})}function newWork(){let name=prompt("作品名を入力してください","新しいマダミス");if(!name)return;let id=uid();all.works[id]=freshWork(name);all.current=id;current=all.works[id];save();renderAll()}function renameWork(){let name=prompt("作品名",current.name);if(name){current.name=name;save();renderWorkTabs()}}function deleteWork(){if(!confirm("現在の作品を削除しますか？"))return;let ids=Object.keys(all.works);if(ids.length===1){alert("最後の作品は削除できません。");return}delete all.works[all.current];all.current=Object.keys(all.works)[0];current=all.works[all.current];save();renderAll()}function showView(id,btn){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("#viewTabs .tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}function addTimeline(pref={}){current.timeline.push({id:uid(),order:current.timeline.length+1,time:"",place:"",people:"",event:"",source:"",certainty:"未確認",memo:"",...pref});save();renderTimeline()}function charNames(){return current.characters.map(c=>c.name).filter(Boolean)}function sourceSelect(value,i){let opts=['未確認','本人の証言',...charNames(),'証拠品','GM情報','その他'],seen=[];opts=opts.filter(x=>!seen.includes(x)&&seen.push(x));return `<select onchange="tlEdit(${i},'source',this.value)">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join("")}</select>`}function timeSelect(value,i){let opts=[''];for(let h=0;h<24;h++)for(let m=0;m<60;m+=5)opts.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));return `<select style="min-width:92px" onchange="tlEdit(${i},'time',this.value)">${opts.map(x=>`<option value="${x}" ${x===value?'selected':''}>${x||'—'}</option>`).join("")}</select>`}function renderTimeline(){let tb=document.querySelector("#timelineTable tbody");tb.innerHTML="";current.timeline.forEach((r,i)=>{let tr=document.createElement("tr");[["order",r.order],["time",r.time],["place",r.place],["people",r.people],["event",r.event]].forEach(([k,v])=>{let td=document.createElement("td");if(k==="time")td.innerHTML=timeSelect(r.time,i);else{td.contentEditable=true;td.textContent=v??"";td.oninput=()=>{r[k]=td.textContent;save()}}tr.appendChild(td)});let td=document.createElement("td");td.innerHTML=sourceSelect(r.source,i);tr.appendChild(td);td=document.createElement("td");td.contentEditable=true;td.textContent=r.certainty||"";td.oninput=()=>{r.certainty=td.textContent;save()};tr.appendChild(td);td=document.createElement("td");td.contentEditable=true;td.textContent=r.memo||"";td.oninput=()=>{r.memo=td.textContent;save()};tr.appendChild(td);td=document.createElement("td");let b=document.createElement("button");b.textContent="×";b.className="danger";b.onclick=()=>{current.timeline.splice(i,1);save();renderTimeline();renderCharacters()};td.appendChild(b);tr.appendChild(td);tb.appendChild(tr)})}function tlEdit(i,k,v){current.timeline[i][k]=v;save();renderCharacters()}function addCharacter(){let name=prompt("キャラクター名を入力してください","新しい人物");if(!name)return;current.characters.push({id:uid(),name,alias:"",relation:"",memo:""});save();renderAll()}function removeChar(i){if(confirm(current.characters[i].name+" を削除しますか？")){current.characters.splice(i,1);save();renderAll()}}function charEdit(i,k,v){current.characters[i][k]=v;save();if(k==="name"){renderWorkTabs();renderTimeline()}}function renderCharacters(){let g=document.getElementById("charactersGrid");g.innerHTML="";if(!current.characters.length){g.innerHTML='<div class="empty">「＋ キャラを追加」から人物を登録してください。</div>';return}current.characters.forEach((c,i)=>{let rows=current.timeline.filter(r=>String(r.people).includes(c.name)||String(r.source)===c.name),d=document.createElement("div");d.className="card character";d.innerHTML=`<div class="row"><h3 class="grow">${esc(c.name)}</h3><button class="danger" onclick="removeChar(${i})">削除</button></div><label>名前</label><input value="${esc(c.name)}" oninput="charEdit(${i},'name',this.value)"><label>呼び方・呼ばれ方</label><input value="${esc(c.alias)}" placeholder="例：A→Bは「先生」" oninput="charEdit(${i},'alias',this.value)"><label>関係性</label><input value="${esc(c.relation)}" placeholder="例：幼馴染・上司・共犯？" oninput="charEdit(${i},'relation',this.value)"><details open><summary>このキャラの時系列 <span class="badge">${rows.length}件</span></summary><div class="detailsbody">${rows.length?rows.map(r=>`<div style="padding:7px 0;border-bottom:1px solid #eee"><b>${esc(r.time||"時間不明")}</b>　${esc(r.event)}<div class="mini">場所：${esc(r.place)} ／ 情報源：${esc(r.source||"未記録")} ／ 確度：${esc(r.certainty||"")}</div></div>`).join(""):'<span class="hint">全体時系列でこの人物を登録するとここに反映されます。</span>'}</div></details><details><summary>このキャラに関する証拠</summary><div class="detailsbody">${renderCharEvidence(c.name)}</div></details><details><summary>自由メモ</summary><div class="detailsbody"><textarea placeholder="推理、印象、疑問、伏線など何でも" oninput="charEdit(${i},'memo',this.value)">${esc(c.memo)}</textarea></div></details>`;g.appendChild(d)})}function renderCharEvidence(name){let arr=current.evidence.filter(e=>String(e.people||"").includes(name));return arr.length?arr.map(e=>`<div style="padding:6px 0;border-bottom:1px solid #eee"><b>${esc(e.title||"無題")}</b><div class="mini">${esc(e.type||"")} ／ ${esc(e.source||"")} ／ ${esc(e.certainty||"")}</div></div>`).join(""):'<span class="hint">このキャラに関連するメモはありません。</span>'}function addEvidence(){current.evidence.push({id:uid(),type:"証拠",title:"",people:"",place:"",time:"",source:"",certainty:"未確認",memo:"",open:true});save();renderEvidence()}function evidenceEdit(i,k,v){current.evidence[i][k]=v;save()}function removeEvidence(i){current.evidence.splice(i,1);save();renderEvidence()}function renderEvidence(){let el=document.getElementById("evidenceList");el.innerHTML="";if(!current.evidence.length){el.innerHTML='<div class="empty">「＋ メモを追加」から証拠・発言・推理などを登録してください。</div>';return}current.evidence.forEach((e,i)=>{let d=document.createElement("details");d.open=e.open!==false;d.ontoggle=()=>{e.open=d.open;save()};d.innerHTML=`<summary><span class="badge">${esc(e.type)}</span>${esc(e.title||"無題")}</summary><div class="detailsbody"><label>分類</label><select onchange="evidenceEdit(${i},'type',this.value);renderEvidence()"><option ${e.type==='証拠'?'selected':''}>証拠</option><option ${e.type==='発言'?'selected':''}>発言</option><option ${e.type==='推理'?'selected':''}>推理</option><option ${e.type==='疑問'?'selected':''}>疑問</option><option ${e.type==='メモ'?'selected':''}>メモ</option></select><label>タイトル</label><input value="${esc(e.title)}" oninput="evidenceEdit(${i},'title',this.value)"><label>関連人物</label><input value="${esc(e.people)}" placeholder="例：A、B" oninput="evidenceEdit(${i},'people',this.value)"><label>場所</label><input value="${esc(e.place)}" oninput="evidenceEdit(${i},'place',this.value)"><label>時刻</label><input value="${esc(e.time)}" placeholder="例：21:30" oninput="evidenceEdit(${i},'time',this.value)"><label>情報源</label><input value="${esc(e.source)}" oninput="evidenceEdit(${i},'source',this.value)"><label>確度</label><input value="${esc(e.certainty)}" oninput="evidenceEdit(${i},'certainty',this.value)"><label>内容・推理メモ</label><textarea oninput="evidenceEdit(${i},'memo',this.value)">${esc(e.memo)}</textarea><div class="toolbar" style="margin-top:9px"><button class="danger" onclick="removeEvidence(${i})">削除</button></div></div>`;el.appendChild(d)})}function exportAll(){let blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='madamis-note-backup.json';a.click();URL.revokeObjectURL(a.href)}function importAll(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.works)throw Error();all=x;ensure();save();renderAll();alert('復元しました。')}catch(e){alert('復元できないJSONです。')}};r.readAsText(f);ev.target.value=''}function renderAll(){ensure();renderWorkTabs();renderTimeline();renderCharacters();renderEvidence()}renderAll();</script></body></html>
