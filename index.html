<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マダミス・ノート</title><style>:root{--bg:#fffaf2;--card:#fffdf9;--line:#eadfce;--text:#403b35;--muted:#8d8378;--accent:#f2b84b;--danger:#c95b62;--shadow:0 5px 18px rgba(80,55,25,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Hiragino Sans","Noto Sans JP",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:9px 12px;cursor:pointer;box-shadow:0 2px 7px rgba(80,55,25,.04)}button:active{transform:translateY(1px)}header{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.97);border-bottom:1px solid var(--line);padding:10px;box-shadow:0 2px 12px rgba(80,55,25,.07);backdrop-filter:blur(8px)}.headrow,.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.title{font-weight:1000;font-size:24px;letter-spacing:.04em;white-space:nowrap;color:#5a4f45;line-height:1.1;text-shadow:1px 1px 0 #fff2cf}.status{margin-left:auto;color:var(--muted);font-size:11px}.workbar,.tabs{display:flex;gap:7px;overflow-x:auto;padding:6px 0}.workbar button,.tab{white-space:nowrap}.tab.active{background:var(--accent);color:#fff;border-color:#e2a83d}.layout{max-width:1400px;margin:auto;padding:12px}.view{display:none}.view.active{display:block}h2{font-size:20px;color:#5a4f45}.hint,.mini{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tablewrap{overflow:auto;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)}table{border-collapse:separate;border-spacing:0;width:max(100%,1200px);background:var(--card)}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px;vertical-align:top}th{background:#fff2cf;color:#665438;font-size:12px}td[contenteditable]{min-width:90px;outline:none}input,textarea,select{border:1px solid #ddcfbd;border-radius:14px;padding:9px;background:#fffdfa;color:var(--text);width:100%;outline:none}textarea{min-height:90px;resize:vertical}.danger{color:var(--danger)}details{background:var(--card);border:1px solid var(--line);border-radius:17px;margin:8px 0;overflow:hidden}summary{padding:11px;font-weight:800;color:#5a4f45;cursor:pointer;list-style:none;background:#fffaf3}summary::-webkit-details-marker{display:none}.detailsbody{padding:0 11px 11px}.character-fold>summary{display:flex;align-items:center;gap:8px;padding:13px}.character-name,.location-name{font-weight:900;flex:1}.character-count{font-size:10px;padding:4px 7px;border-radius:999px;background:#fff0bd;color:#765c1d}.character-body,.location-body{padding:0 12px 12px;border-top:1px solid var(--line)}.badge{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#fff0bd;color:#765c1d}.empty{padding:25px;text-align:center;color:var(--muted);border:2px dashed #e5d6c2;border-radius:18px}.picker{position:relative;margin:0}.picker-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:#fffaf3}.picker-value{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picker-arrow{font-size:11px;color:var(--muted);flex:none;margin-left:6px}.picker-menu{display:none;margin-top:4px;border:1px solid var(--line);border-radius:14px;background:#fffaf3;box-shadow:var(--shadow);padding:5px;max-height:150px;overflow-y:auto}.picker.open .picker-menu{display:block}.person-chip{width:100%;text-align:left;border-radius:11px;padding:8px 10px;background:#fffdf9;margin:2px 0}.person-chip.selected{background:#ffe29a;border-color:#e2aa42;font-weight:800}.location-list{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto}.location-fold>summary{display:flex;align-items:center;gap:8px}@media(max-width:650px){.layout{padding:8px}.card{border-radius:18px}.status{display:none}th,td{font-size:12px;padding:6px}}.picker-menu{display:none;margin-top:4px;border:1px solid var(--line);border-radius:14px;background:#fffaf3;box-shadow:var(--shadow);padding:5px;max-height:150px;overflow-y:auto}.picker.open .picker-menu{display:block}.person-chip{width:100%;text-align:left;border-radius:11px;padding:8px 10px;background:#fffdf9;margin:2px 0}.person-chip.selected{background:#ffe29a;border-color:#e2aa42;font-weight:800}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(50,40,30,.42);z-index:1000;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.open{display:flex}.picker-modal{width:min(560px,100%);max-height:82vh;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px rgba(50,40,30,.22);display:flex;flex-direction:column;overflow:hidden}.picker-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);background:#fffaf3}.picker-modal-list{overflow-y:auto;padding:8px 12px}.picker-modal-list .person-chip{font-size:15px;padding:12px;margin:4px 0}.picker-modal-foot{padding:10px 12px;border-top:1px solid var(--line)}.picker-modal-foot button{width:100%;background:var(--accent);color:#fff;border-color:#e2a83d;font-weight:800}@media(min-width:651px){.picker-modal{margin-bottom:10vh}}@media(max-width:650px){.picker-menu{display:none!important}} .alibi-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin:10px 0 12px}.alibi-table{border-collapse:collapse;width:100%;min-width:620px;background:#fffdfa}.alibi-table th,.alibi-table td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;font-size:12px}.alibi-table th{background:#fff2cf;white-space:nowrap}.alibi-table .uncertain{color:#9a6b22;background:#fff9e8}.alibi-empty{padding:12px;color:var(--muted);font-size:12px;background:#fffaf3;border-radius:12px}.alibi-title{font-weight:900;font-size:14px;margin:14px 0 6px;color:#5a4f45}</style></head><body><div id="pickerModal" class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="picker-modal" role="dialog" aria-modal="true"><div class="picker-modal-head"><strong id="pickerModalTitle">選択</strong><button type="button" onclick="closeModal()">閉じる</button></div><div id="pickerModalList" class="picker-modal-list"></div><div class="picker-modal-foot"><button type="button" onclick="closeModal()">選択を完了</button></div></div></div><header><div class="headrow"><div class="title">マダミスメモ</div><div class="status" id="status">自動保存</div></div><div class="workbar"><button onclick="newWork()">＋ 作品</button><button onclick="renameWork()">作品名変更</button><button onclick="deleteWork()" class="danger">作品削除</button><button onclick="exportAll()">バックアップ</button><button onclick="document.getElementById('importFile').click()">復元</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importAll(event)"></div><div class="tabs" id="workTabs"></div></header><div class="layout"><div class="tabs" id="viewTabs"><button class="tab active" onclick="showView('timeline',this)">全体時系列</button><button class="tab" onclick="showView('characters',this)">キャラ</button><button class="tab" onclick="showView('locations',this)">場所</button><button class="tab" onclick="showView('evidence',this)">証拠・推理</button></div><main><section id="timeline" class="view active"><h2>全体時系列</h2><div class="toolbar"><button onclick="addTimeline()">＋ 時系列を追加</button><span class="hint">時間順に自動表示。人物・同行者・証言者・場所はタップで開く縦スクロール選択。</span></div><div class="card tablewrap"><table id="timelineTable"><thead><tr><th>順番</th><th>時間</th><th>場所</th><th>人物</th><th>誰といたか</th><th>出来事</th><th>証言者</th><th>確度</th><th>メモ</th><th>削除</th></tr></thead><tbody></tbody></table></div></section><section id="characters" class="view"><h2>キャラクター</h2><div class="toolbar"><button onclick="addCharacter()">＋ キャラを追加</button></div><div id="charactersGrid"></div></section><section id="locations" class="view"><h2>場所</h2><div class="toolbar"><button onclick="addLocation()">＋ 場所を追加</button><span class="hint">場所ごとのメモと、その場所で起きた時系列をまとめて確認できます。</span></div><div id="locationsGrid"></div></section><section id="evidence" class="view"><h2>証拠・推理メモ</h2><div class="toolbar"><button onclick="addEvidence()">＋ メモを追加</button></div><div id="evidenceList"></div></section></main></div><script>
const KEY='murder_mystery_notebook_v2';let all=JSON.parse(localStorage.getItem(KEY)||'{"works":{},"current":null}'),current=null;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function freshWork(name){return{name,characters:[],locations:[],timeline:[],evidence:[]}}function ensure(){if(!all.works||typeof all.works!=='object')all={works:{},current:null};let ids=Object.keys(all.works);if(!ids.length){let id=uid();all.works[id]=freshWork('新しいマダミス');all.current=id}if(!all.current||!all.works[all.current])all.current=Object.keys(all.works)[0];current=all.works[all.current];if(!Array.isArray(current.locations))current.locations=[];if(!Array.isArray(current.characters))current.characters=[];if(!Array.isArray(current.timeline))current.timeline=[];if(!Array.isArray(current.evidence))current.evidence=[];current.timeline.forEach(r=>{r.peopleNames=Array.isArray(r.peopleNames)?r.peopleNames:(String(r.people||'').split(/[、,\/\s]+/).filter(Boolean));r.companions=Array.isArray(r.companions)?r.companions:[];r.witnesses=Array.isArray(r.witnesses)?r.witnesses:[]})}function save(){localStorage.setItem(KEY,JSON.stringify(all));let s=document.getElementById('status');if(s)s.textContent='保存済み '+new Date().toLocaleTimeString()}function renderWorkTabs(){let e=document.getElementById('workTabs');e.innerHTML='';Object.entries(all.works).forEach(([id,w])=>{let b=document.createElement('button');b.className='tab '+(id===all.current?'active':'');b.textContent=w.name;b.onclick=()=>{all.current=id;ensure();save();renderAll()};e.appendChild(b)})}function newWork(){let n=prompt('作品名','新しいマダミス');if(!n)return;let id=uid();all.works[id]=freshWork(n);all.current=id;ensure();save();renderAll()}function renameWork(){let n=prompt('作品名',current.name);if(n){current.name=n;save();renderWorkTabs()}}function deleteWork(){if(Object.keys(all.works).length===1)return alert('最後の作品は削除できません。');if(confirm('現在の作品を削除しますか？')){delete all.works[all.current];all.current=Object.keys(all.works)[0];ensure();save();renderAll()}}function showView(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('#viewTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function charNames(){return current.characters.map(c=>c.name).filter(Boolean)}function selected(a,empty){return a&&a.length?a.join('・'):empty}function closePickers(except){document.querySelectorAll('.picker.open').forEach(p=>{if(p!==except)p.classList.remove('open')})}document.addEventListener('click',e=>{if(!e.target.closest('.picker'))closePickers(null)});function picker(arr,field,i,label){let id='pk_'+i+'_'+field;return `<div class="picker" id="${id}"><button type="button" class="picker-toggle" data-picker-index="${i}" data-picker-field="${esc(field)}"><span class="picker-value">${esc(label)}</span><span class="picker-arrow">▼</span></button></div>`}
function openPickerModal(i,f,e){if(e)e.stopPropagation();let r=current.timeline[i],arr=Array.isArray(r[f])?r[f]:[],title=f==='peopleNames'?'人物を選択':f==='companions'?'誰といたか':'証言者';document.getElementById('pickerModalTitle').textContent=title;let list=document.getElementById('pickerModalList'),ns=charNames();list.innerHTML='';if(!ns.length){list.innerHTML='<div class="hint">先にキャラクターを登録してください。</div>'}else{ns.forEach((n,j)=>{let label=document.createElement('label');label.className='person-chip'+(arr.includes(n)?' selected':'');label.style.display='flex';label.style.alignItems='center';label.style.gap='10px';label.style.cursor='pointer';let cb=document.createElement('input');cb.type='checkbox';cb.checked=arr.includes(n);cb.dataset.pickerIndex=String(i);cb.dataset.pickerField=f;cb.dataset.pickerName=n;cb.style.width='22px';cb.style.height='22px';cb.style.flex='0 0 auto';let span=document.createElement('span');span.textContent=n;label.appendChild(cb);label.appendChild(span);list.appendChild(label)})}document.getElementById('pickerModal').classList.add('open')}
function closeModal(){document.getElementById('pickerModal').classList.remove('open')}
function setPersonChecked(i,f,n,checked){let r=current.timeline[i],arr=Array.isArray(r[f])?r[f]:[];let p=arr.indexOf(n);if(checked&&p<0)arr.push(n);if(!checked&&p>=0)arr.splice(p,1);r[f]=arr;if(f==='peopleNames')r.people=arr.join('、');if(f==='witnesses')r.source=arr.join('、');save();let value=selected(arr,f==='peopleNames'?'人物を選択':f==='companions'?'誰といたか':'証言者');renderTimeline();renderCharacters();openPickerModal(i,f);document.querySelectorAll('#pickerModalList label.person-chip').forEach(x=>{let input=x.querySelector('input');if(input){x.classList.toggle('selected',input.checked)}})}
function toggleModalPerson(i,f,n){let r=current.timeline[i],arr=Array.isArray(r[f])?r[f]:[];setPersonChecked(i,f,n,!arr.includes(n))}
function togglePicker(id,e){openPickerModal(Number(id.split('_')[1]),id.split('_').slice(2).join('_'),e)}
function togglePerson(i,f,n,e){toggleModalPerson(i,f,n)}
function placePicker(v,i){return `<div class="picker"><button type="button" class="picker-toggle" data-place-index="${i}"><span class="picker-value">${esc(v||'場所を選択')}</span><span class="picker-arrow">▼</span></button></div>`}
function openPlaceModal(i,e){if(e)e.stopPropagation();let v=current.timeline[i].place||'',ns=current.locations.map(x=>x.name).filter(Boolean);document.getElementById('pickerModalTitle').textContent='場所を選択';let list=document.getElementById('pickerModalList');list.innerHTML='';if(!ns.length){list.innerHTML='<div class="hint">「場所」タブから登録してください。</div>'}else{ns.forEach(n=>{let label=document.createElement('label');label.className='person-chip'+(v===n?' selected':'');label.style.display='flex';label.style.alignItems='center';label.style.gap='10px';label.style.cursor='pointer';let cb=document.createElement('input');cb.type='radio';cb.name='place-choice';cb.checked=v===n;cb.dataset.placeIndex=String(i);cb.dataset.placeName=n;cb.style.width='22px';cb.style.height='22px';cb.style.flex='0 0 auto';let span=document.createElement('span');span.textContent=n;label.appendChild(cb);label.appendChild(span);list.appendChild(label)})}document.getElementById('pickerModal').classList.add('open')}
function setPlace(i,n,e){if(e)e.stopPropagation();current.timeline[i].place=n;save();renderTimeline();renderLocations();closeModal()}
document.addEventListener('change',e=>{let cb=e.target.closest('#pickerModalList input[type="checkbox"][data-picker-index]');if(cb){setPersonChecked(Number(cb.dataset.pickerIndex),cb.dataset.pickerField,cb.dataset.pickerName,cb.checked);return}let radio=e.target.closest('#pickerModalList input[type="radio"][data-place-index]');if(radio){setPlace(Number(radio.dataset.placeIndex),radio.dataset.placeName);return}});
document.addEventListener('click',e=>{let pickerBtn=e.target.closest('.picker-toggle[data-picker-index]');if(pickerBtn){e.preventDefault();e.stopPropagation();openPickerModal(Number(pickerBtn.dataset.pickerIndex),pickerBtn.dataset.pickerField,e);return}let placeBtn=e.target.closest('.picker-toggle[data-place-index]');if(placeBtn){e.preventDefault();e.stopPropagation();openPlaceModal(Number(placeBtn.dataset.placeIndex),e);return}if(e.target.id==='pickerModal')closeModal()});
function addTimeline(){current.timeline.push({id:uid(),time:'',place:'',people:'',peopleNames:[],companions:[],event:'',source:'',witnesses:[],certainty:'未確認',memo:''});save();renderTimeline()}function timeKey(t){let m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):99999}function timeSelect(v,i){let a=[''];for(let h=0;h<24;h++)for(let m=0;m<60;m+=5)a.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));return `<select onchange="editTL(${i},'time',this.value)">${a.map(x=>`<option value="${x}" ${x===v?'selected':''}>${x||'—'}</option>`).join('')}</select>`}function renderTimeline(){let tb=document.querySelector('#timelineTable tbody');tb.innerHTML='';current.timeline.map((r,i)=>({r,i})).sort((a,b)=>timeKey(a.r.time)-timeKey(b.r.time)||a.i-b.i).forEach((x,n)=>{let r=x.r,i=x.i,tr=document.createElement('tr');tr.innerHTML=`<td>${n+1}</td><td>${timeSelect(r.time,i)}</td><td>${placePicker(r.place,i)}</td><td>${picker(r.peopleNames||[],'peopleNames',i,selected(r.peopleNames||[],'人物を選択'))}</td><td>${picker(r.companions||[],'companions',i,selected(r.companions||[],'誰といたか'))}</td><td contenteditable="true">${esc(r.event||'')}</td><td>${picker(r.witnesses||[],'witnesses',i,selected(r.witnesses||[],'証言者'))}</td><td contenteditable="true">${esc(r.certainty||'未確認')}</td><td contenteditable="true">${esc(r.memo||'')}</td><td><button class="danger" onclick="delTL(${i})">×</button></td>`;let ed=tr.querySelectorAll('[contenteditable]');ed[0].oninput=()=>{r.event=ed[0].textContent;save()};ed[1].oninput=()=>{r.certainty=ed[1].textContent;save()};ed[2].oninput=()=>{r.memo=ed[2].textContent;save()};tb.appendChild(tr)})}function editTL(i,k,v){current.timeline[i][k]=v;save();renderTimeline();renderCharacters();renderLocations()}function delTL(i){current.timeline.splice(i,1);save();renderTimeline();renderCharacters();renderLocations()}
function addCharacter(){let n=prompt('キャラクター名','新しい人物');if(!n)return;current.characters.push({id:uid(),name:n,alias:'',relation:'',memo:'',open:false});save();renderAll()}function renderCharacters(){let g=document.getElementById('charactersGrid');g.innerHTML='';if(!current.characters.length){g.innerHTML='<div class="empty">「＋ キャラを追加」から人物を登録してください。</div>';return}current.characters.forEach((c,i)=>{let rows=current.timeline.filter(r=>(r.peopleNames||[]).includes(c.name)||(r.companions||[]).includes(c.name)||(r.witnesses||[]).includes(c.name)).sort((a,b)=>timeKey(a.time)-timeKey(b.time));let alibiRows=current.timeline.filter(r=>(r.peopleNames||[]).includes(c.name)).sort((a,b)=>timeKey(a.time)-timeKey(b.time));let alibi=alibiRows.length?'<div class="alibi-table-wrap"><table class="alibi-table"><thead><tr><th>時間</th><th>場所</th><th>出来事</th><th>同行者</th><th>証言者</th><th>確度</th></tr></thead><tbody>'+alibiRows.map(r=>'<tr><td>'+esc(r.time||'時間不明')+'</td><td>'+esc(r.place||'未記録')+'</td><td>'+esc(r.event||'未記録')+'</td><td>'+esc((r.companions||[]).filter(n=>n!==c.name).join('・')||'なし')+'</td><td>'+esc((r.witnesses||[]).join('・')||'なし')+'</td><td class="'+(r.certainty&&r.certainty!=='未確認'?'':'uncertain')+'">'+esc(r.certainty||'未確認')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="alibi-empty">この人物が登場する時系列はまだありません。</div>';let d=document.createElement('details');d.className='character-fold';d.open=!!c.open;d.ontoggle=()=>{c.open=d.open;save()};d.innerHTML='<summary><span class="character-name">'+esc(c.name)+'</span><span class="character-count">時系列 '+rows.length+'件</span></summary><div class="character-body"><button class="danger" onclick="event.preventDefault();current.characters.splice('+i+',1);save();renderAll()">キャラを削除</button><label>名前</label><input value="'+esc(c.name)+'" oninput="editChar('+i+',\'name\',this.value)"><label>呼び方・呼ばれ方</label><input value="'+esc(c.alias)+'" oninput="editChar('+i+',\'alias\',this.value)"><label>関係性</label><input value="'+esc(c.relation)+'" oninput="editChar('+i+',\'relation\',this.value)"><div class="alibi-title">このキャラのアリバイ表</div>'+alibi+'<details><summary>このキャラの時系列</summary><div class="detailsbody">'+rows.map(r=>'<div><b>'+esc(r.time||'時間不明')+'</b> '+esc(r.event||'')+'<div class="mini">場所：'+esc(r.place||'')+' ／ 同行：'+esc((r.companions||[]).join('・')||'なし')+' ／ 証言者：'+esc((r.witnesses||[]).join('・')||'未記録')+'</div></div>').join('')||'<span class="hint">時系列なし</span>'+'</div></details><details><summary>自由メモ</summary><div class="detailsbody"><textarea oninput="editChar('+i+',\'memo\',this.value)">'+esc(c.memo)+'</textarea></div></details></div>';g.appendChild(d)})}function editChar(i,k,v){current.characters[i][k]=v;save();renderTimeline();renderCharacters()}
function addLocation(){let n=prompt('場所の名前','新しい場所');if(!n)return;current.locations.push({id:uid(),name:n,memo:'',open:false});save();renderAll()}function renderLocations(){let g=document.getElementById('locationsGrid');g.innerHTML='';if(!current.locations.length){g.innerHTML='<div class="empty">「＋ 場所を追加」から登録してください。</div>';return}let list=document.createElement('div');list.className='location-list';current.locations.forEach((l,i)=>{let rows=current.timeline.filter(r=>r.place===l.name),d=document.createElement('details');d.className='location-fold';d.open=!!l.open;d.ontoggle=()=>{l.open=d.open;save()};d.innerHTML=`<summary><span class="location-name">${esc(l.name)}</span><span class="character-count">${rows.length}件</span></summary><div class="location-body"><button class="danger" onclick="event.preventDefault();current.locations.splice(${i},1);save();renderAll()">場所を削除</button><label>場所名</label><input value="${esc(l.name)}" oninput="editLoc(${i},'name',this.value)"><label>場所メモ</label><textarea placeholder="構造・出入口・特徴など" oninput="editLoc(${i},'memo',this.value)">${esc(l.memo)}</textarea><details><summary>この場所の時系列</summary><div class="detailsbody">${rows.sort((a,b)=>timeKey(a.time)-timeKey(b.time)).map(r=>`<div><b>${esc(r.time||'時間不明')}</b> ${esc(r.event||'')}<div class="mini">人物：${esc((r.peopleNames||[]).join('・')||'未記録')} ／ 同行：${esc((r.companions||[]).join('・')||'なし')}</div></div>`).join('')||'<span class="hint">まだありません。</span>'}</div></details></div>`;list.appendChild(d)});g.appendChild(list)}function editLoc(i,k,v){current.locations[i][k]=v;save();renderLocations();if(k==='name')renderTimeline()}
function addEvidence(){current.evidence.push({id:uid(),title:'新しいメモ',type:'推理',content:'',related:'',source:'未記録',certainty:'未確認',open:true});save();renderEvidence()}function renderEvidence(){let g=document.getElementById('evidenceList');g.innerHTML='';if(!current.evidence.length){g.innerHTML='<div class="empty">「＋ メモを追加」から追加してください。</div>';return}current.evidence.forEach((e,i)=>{let d=document.createElement('details');d.open=!!e.open;d.ontoggle=()=>{e.open=d.open;save()};d.innerHTML=`<summary><span class="badge">${esc(e.type)}</span> ${esc(e.title)}</summary><div class="detailsbody"><input value="${esc(e.title)}" oninput="editE(${i},'title',this.value)"><label>種類</label><select onchange="editE(${i},'type',this.value)">${['証拠','発言','推理','疑問','その他'].map(x=>`<option ${x===e.type?'selected':''}>${x}</option>`).join('')}</select><label>内容</label><textarea oninput="editE(${i},'content',this.value)">${esc(e.content)}</textarea><label>関連人物・場所・時刻</label><input value="${esc(e.related)}" oninput="editE(${i},'related',this.value)"><label>情報源</label><input value="${esc(e.source)}" oninput="editE(${i},'source',this.value)"><label>確度</label><input value="${esc(e.certainty)}" oninput="editE(${i},'certainty',this.value)"><button class="danger" onclick="current.evidence.splice(${i},1);save();renderEvidence()">削除</button></div>`;g.appendChild(d)})}function editE(i,k,v){current.evidence[i][k]=v;save();renderEvidence()}
function exportAll(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(all,null,2)],{type:'application/json'}));a.download='murder-mystery-notebook.json';a.click()}function importAll(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{all=JSON.parse(r.result);ensure();save();renderAll();alert('復元しました')}catch(e){alert('バックアップを読み込めませんでした')}};r.readAsText(f)}function renderAll(){ensure();renderWorkTabs();renderTimeline();renderCharacters();renderLocations();renderEvidence()}renderAll();</script></body></html>
