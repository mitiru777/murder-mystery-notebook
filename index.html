<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マダミス・ノート v4</title><style>body{margin:0;background:#070707;color:#ffd900;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}header{padding:10px;background:#090909;border-bottom:1px solid #443b12;position:sticky;top:0;z-index:10}.row{display:flex;gap:7px;align-items:center;overflow:auto}.title{font-weight:900;white-space:nowrap}.btn{background:#151515;color:#ffd900;border:1px solid #554b17;border-radius:9px;padding:8px 10px;white-space:nowrap}.primary{background:#ffd900;color:#111;font-weight:800}.panel{margin:10px;padding:12px;background:#111;border:1px solid #343434;border-radius:12px}.sub{color:#aaa06b;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}.card{background:#151515;border:1px solid #393939;border-radius:10px;padding:10px;color:#fff8c9}.card h3{color:#ffd900;margin:0 0 8px}.warn{border-left:4px solid #ff6969}.ok{border-left:4px solid #9fe06b}.info{border-left:4px solid #ffd900}input,select,textarea{width:100%;box-sizing:border-box;background:#0e0e0e;color:#fff8c9;border:1px solid #333;border-radius:7px;padding:8px}label{display:block;color:#aaa06b;font-size:11px;margin:8px 0 4px}.small{font-size:11px;color:#aaa06b}.raw{white-space:pre-wrap;max-height:45vh;overflow:auto;background:#090909;border:1px solid #333;padding:9px;border-radius:8px;font-size:12px}</style></head><body><header><div class="row"><div class="title">🕵️ マダミス・ノート v4</div><button class="btn primary" onclick="document.getElementById('pdf').click()">📄 HO PDFを読み込む</button><input id="pdf" type="file" accept="application/pdf" style="display:none" onchange="importPDF(event)"><button class="btn" onclick="checkAll()">⚖️ 矛盾チェック</button><a class="btn" href="./index.html">通常ノートへ</a></div></header><div class="panel"><h3>HO自動取り込み</h3><div class="sub">PDFをブラウザ内で読み込み、明示された人物名・HO番号・時刻と、その周辺の原文を抽出します。原文は保持し、曖昧な情報を勝手に補完しません。</div><div id="pdfStatus" class="small">PDF未読込</div><div id="hoResults" class="grid" style="margin-top:8px"></div></div><div class="panel"><h3>推理・アリバイ整合性</h3><div class="sub">通常ノートに保存されている時系列・人物・同行者・証拠を横断して、機械的に矛盾を探します。</div><div id="checks"></div></div><div class="panel"><h3>人物別アリバイ文章</h3><div id="summaries" class="grid"></div></div><script>const KEY='murder_mystery_notebook_v2';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function current(){let a=data();return a.works&&a.current&&a.works[a.current]?a.works[a.current]:null}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tk(t){let m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):999999}function checkAll(){let w=current();let el=document.getElementById('checks');if(!w){el.innerHTML='<div class="card warn">作品データがありません。</div>';return}let chars=w.characters||[],rows=w.timeline||[],issues=[];for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++){if(!rows[i].time||rows[i].time!==rows[j].time)continue;let common=(rows[i].people||[]).filter(x=>(rows[j].people||[]).includes(x));if(common.length&&rows[i].place&&rows[j].place&&rows[i].place!==rows[j].place)common.forEach(id=>{let n=chars.find(c=>c.id===id)?.name||id;issues.push(`同時刻・別場所：${n} が ${rows[i].time} に「${rows[i].place}」と「${rows[j].place}」の両方に登録されています。`)})}rows.forEach(r=>(r.companions||[]).forEach(id=>{if(!(r.people||[]).includes(id)){let n=chars.find(c=>c.id===id)?.name||id;issues.push(`同行者不整合：${r.time||'時刻不明'} ${r.place||'場所不明'}で${n}が同行者に入っていますが、人物欄にいません。`)}}));(w.evidence||[]).forEach(e=>{if(!e.time)return;(e.people||'').split(/[、,\/]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{let c=chars.find(c=>c.name===n);if(!c)return;rows.filter(r=>r.time===e.time&&(r.people||[]).includes(c.id)).forEach(r=>{if(e.place&&r.place&&e.place!==r.place)issues.push(`証拠とアリバイの場所不一致：${e.title||'無題'} は ${e.time} に${e.place}、${n}は${r.place}。`)})})});el.innerHTML=issues.length?issues.map(x=>`<div class="card warn">⚠️ ${esc(x)}</div>`).join(''):'<div class="card ok">✓ 登録データ上、大きな矛盾は見つかりませんでした。これは真相の保証ではありません。</div>';renderSummaries()}function renderSummaries(){let w=current(),g=document.getElementById('summaries');if(!w){g.innerHTML='';return}let chars=w.characters||[],rows=w.timeline||[];g.innerHTML=chars.map(c=>{let rr=rows.filter(r=>(r.people||[]).includes(c.id)).sort((a,b)=>tk(a.time)-tk(b.time));return `<div class="card"><h3>${esc(c.name)}のアリバイ</h3>${rr.length?rr.map(r=>`<div style="padding:6px 0;border-bottom:1px solid #292929"><b>${esc(r.time||'時刻不明')}</b>、${esc(r.place||'場所不明')}にいた。${esc(r.event||'')}${(r.companions||[]).length?'（同行：'+esc((r.companions||[]).map(id=>chars.find(x=>x.id===id)?.name).filter(Boolean).join('・'))+'）':''}</div>`).join(''):'<span class="small">時系列情報なし</span>'}</div>`}).join('')}async function importPDF(ev){let f=ev.target.files[0];if(!f)return;let st=document.getElementById('pdfStatus');st.textContent='PDFを解析中…';try{let pdf=await loadPdf();let doc=await pdf.getDocument({data:await f.arrayBuffer()}).promise,text='';for(let p=1;p<=doc.numPages;p++){let page=await doc.getPage(p),c=await page.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n'}let parsed=parse(text),a=data(),w=current();if(!w)throw Error('作品なし');w.hoSources=w.hoSources||[];w.hoSources.push({name:f.name,text,importedAt:new Date().toISOString()});let added=0;parsed.chars.forEach(c=>{let ex=w.characters.find(x=>x.name===c.name);if(!ex){let ch={id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:c.name,alias:'',relation:'',memo:'',hoText:c.text,hoLabel:c.label};w.characters.push(ch);added++}else if(!ex.hoText)ex.hoText=c.text});parsed.events.forEach(e=>{let ids=e.names.map(n=>w.characters.find(c=>c.name===n)?.id).filter(Boolean);w.timeline.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),time:e.time,place:e.place,people:ids,companions:[],event:e.event,source:f.name,certainty:'HO原文',memo:'原文：'+e.raw,collapsed:true})});if(parsed.victim&&parsed.victim.name){w.victim=w.victim||{};w.victim.name=parsed.victim.name;w.victim.setting=parsed.victim.setting||''}localStorage.setItem(KEY,JSON.stringify(a));st.textContent=`読み込み完了：人物候補${parsed.chars.length}件・時系列候補${parsed.events.length}件・追加${added}人`;document.getElementById('hoResults').innerHTML=`<div class="card info"><b>抽出結果</b><br>人物：${parsed.chars.length}件<br>時系列：${parsed.events.length}件<br>被害者：${esc(parsed.victim?.name||'未検出')}<br><details><summary>PDF原文を見る</summary><div class="raw">${esc(text)}</div></details></div>`;checkAll()}catch(e){console.error(e);st.textContent='解析失敗';alert('文字情報を持たない画像PDFの場合はOCRが必要です。')}ev.target.value=''}async function loadPdf(){if(window.pdfjsLib)return window.pdfjsLib;if(window._p)return window._p;window._p=new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(pdfjsLib)};s.onerror=rej;document.head.appendChild(s)});return window._p}function parse(text){let blocks=text.split(/(?=(?:HO|ＨＯ|ハンドアウト)\s*\d+)/i),chars=[];blocks.forEach(b=>{let m=b.match(/^(?:HO|ＨＯ|ハンドアウト)\s*(\d+)/i),n=(b.match(/(?:名前|PC名|人物名|キャラクター名)\s*[:：]?\s*([^\n\r]+)/i)||[])[1]||(b.match(/(?:あなたは|あなたの名前は)\s*([^。\n]{1,30})/)||[])[1];if(n){n=n.replace(/[：:]/g,'').trim();chars.push({label:m?'HO'+m[1]:'',name:n,text:b.slice(0,8000)})}});chars=[...new Map(chars.map(x=>[x.name,x])).values()];let victim={},vm=text.match(/(?:被害者|犠牲者)\s*[:：]?\s*([^\n\r]+)/);if(vm)victim.name=vm[1].trim();let ms=[...text.matchAll(/\d{1,2}:\d{2}/g)],events=[];for(let i=0;i<ms.length;i++){let time=ms[i][0],start=ms[i].index+ms[i][0].length,end=i+1<ms.length?ms[i+1].index:text.length,raw=text.slice(start,end).replace(/\s+/g,' ').trim(),event=(raw.split(/[。！？]/)[0]||raw).slice(0,250),place=(event.match(/(?:場所|会場|部屋)\s*[:：]?\s*([^、。]+)/)||[])[1]||'',names=chars.filter(c=>event.includes(c.name)).map(c=>c.name);events.push({time,place,event,names,raw:time+raw.slice(0,500)})}victim.setting=text;return{chars,events,victim}}renderSummaries();checkAll();</script></body></html>
