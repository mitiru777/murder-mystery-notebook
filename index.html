<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マダミス・ノート v4</title><style>body{margin:0;background:#070707;color:#ffd900;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}header{padding:10px;background:#090909;border-bottom:1px solid #443b12;position:sticky;top:0;z-index:10}.row{display:flex;gap:7px;align-items:center;overflow:auto}.title{font-weight:900;white-space:nowrap}.btn{background:#151515;color:#ffd900;border:1px solid #554b17;border-radius:9px;padding:8px 10px;white-space:nowrap}.primary{background:#ffd900;color:#111;font-weight:800}.panel{margin:10px;padding:12px;background:#111;border:1px solid #343434;border-radius:12px}.sub{color:#aaa06b;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}.card{background:#151515;border:1px solid #393939;border-radius:10px;padding:10px;color:#fff8c9}.card h3{color:#ffd900;margin:0 0 8px}.warn{border-left:4px solid #ff6969}.ok{border-left:4px solid #9fe06b}.info{border-left:4px solid #ffd900}input,select,textarea{width:100%;box-sizing:border-box;background:#0e0e0e;color:#fff8c9;border:1px solid #333;border-radius:7px;padding:8px}label{display:block;color:#aaa06b;font-size:11px;margin:8px 0 4px}.small{font-size:11px;color:#aaa06b}.raw{white-space:pre-wrap;max-height:45vh;overflow:auto;background:#090909;border:1px solid #333;padding:9px;border-radius:8px;font-size:12px}</style></head><body><header><div class="row"><div class="title">🕵️ マダミス・ノート</div><button class="btn" onclick="checkAll()">⚖️ 矛盾チェック</button><a class="btn primary" href="./index.html">通常ノートへ</a></div></header><div class="panel"><h3>推理・アリバイ整合性</h3><div class="sub">通常ノートに保存されている時系列・人物・同行者・証拠を横断して、機械的に矛盾を探します。</div><div id="checks"></div></div><div class="panel"><h3>人物別アリバイ文章</h3><div id="summaries" class="grid"></div></div><script>const KEY='murder_mystery_notebook_v2';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function current(){let a=data();return a.works&&a.current&&a.works[a.current]?a.works[a.current]:null}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tk(t){let m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):999999}function checkAll(){let w=current();let el=document.getElementById('checks');if(!w){el.innerHTML='<div class="card warn">作品データがありません。</div>';return}let chars=w.characters||[],rows=w.timeline||[],issues=[];for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++){if(!rows[i].time||rows[i].time!==rows[j].time)continue;let common=(rows[i].people||[]).filter(x=>(rows[j].people||[]).includes(x));if(common.length&&rows[i].place&&rows[j].place&&rows[i].place!==rows[j].place)common.forEach(id=>{let n=chars.find(c=>c.id===id)?.name||id;issues.push(`同時刻・別場所：${n} が ${rows[i].time} に「${rows[i].place}」と「${rows[j].place}」の両方に登録されています。`)})}rows.forEach(r=>(r.companions||[]).forEach(id=>{if(!(r.people||[]).includes(id)){let n=chars.find(c=>c.id===id)?.name||id;issues.push(`同行者不整合：${r.time||'時刻不明'} ${r.place||'場所不明'}で${n}が同行者に入っていますが、人物欄にいません。`)}}));(w.evidence||[]).forEach(e=>{if(!e.time)return;(e.people||'').split(/[、,\/]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{let c=chars.find(c=>c.name===n);if(!c)return;rows.filter(r=>r.time===e.time&&(r.people||[]).includes(c.id)).forEach(r=>{if(e.place&&r.place&&e.place!==r.place)issues.push(`証拠とアリバイの場所不一致：${e.title||'無題'} は ${e.time} に${e.place}、${n}は${r.place}。`)})})});el.innerHTML=issues.length?issues.map(x=>`<div class="card warn">⚠️ ${esc(x)}</div>`).join(''):'<div class="card ok">✓ 登録データ上、大きな矛盾は見つかりませんでした。これは真相の保証ではありません。</div>';renderSummaries()}function renderSummaries(){let w=current(),g=document.getElementById('summaries');if(!w){g.innerHTML='';return}let chars=w.characters||[],rows=w.timeline||[];g.innerHTML=chars.map(c=>{let rr=rows.filter(r=>(r.people||[]).includes(c.id)).sort((a,b)=>tk(a.time)-tk(b.time));return `<div class="card"><h3>${esc(c.name)}のアリバイ</h3>${rr.length?rr.map(r=>`<div style="padding:6px 0;border-bottom:1px solid #292929"><b>${esc(r.time||'時刻不明')}</b>、${esc(r.place||'場所不明')}にいた。${esc(r.event||'')}${(r.companions||[]).length?'（同行：'+esc((r.companions||[]).map(id=>chars.find(x=>x.id===id)?.name).filter(Boolean).join('・'))+'）':''}</div>`).join(''):'<span class="small">時系列情報なし</span>'}</div>`}).join('')}renderSummaries();checkAll();</script></body></html>
