name: Fix character input focus
on:
  push:
    paths:
      - '.github/workflows/fix-character-input.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix text input focus
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # 入力中にDOMを再描画する呼び出しをoninputから除去
          def clean_oninput(m):
              attr = re.sub(r';?\s*render[A-Za-z0-9_]+\([^)]*\)', '', m.group(1))
              return 'oninput="' + attr + '"'
          s = re.sub(r'oninput="([^"]*)"', clean_oninput, s)
          # 推理・証拠の編集関数も入力中は再描画しない
          def clean_edit(m):
              name, args, body = m.group(1), m.group(2), m.group(3)
              if 'evidence' in body.lower() or 'Evidence' in name:
                  body = re.sub(r';?\s*render[A-Za-z0-9_]+\([^)]*\)', '', body)
              return 'function '+name+'('+args+'){'+body+'}'
          s = re.sub(r'function\s+(edit[A-Za-z0-9_]+)\(([^)]*)\)\{([^{}]*)\}', clean_edit, s)
          # フォーカスを外した時だけ表示を更新
          hook = "document.addEventListener('focusout',e=>{if(e.target.matches('input,textarea,select')){setTimeout(()=>{if(e.target.closest('#charactersGrid'))renderCharacters();else if(e.target.closest('#evidenceList')&&typeof renderEvidence==='function')renderEvidence();else renderAll();},0)}});"
          if hook not in s:
              s = s.replace('</script></body></html>', hook + '</script></body></html>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix inference memo input focus'
          git push
