name: Fix character input focus
on:
  push:
    paths:
      - '.github/workflows/fix-character-input.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix text input focus
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function editChar(i,k,v){current.characters[i][k]=v;save();renderTimeline();renderAlibiCheck();renderAlibiMatrix();if(k!=='pairTag')renderCharacters()}"
          new = "function editChar(i,k,v){if(!current.characters[i])return;current.characters[i][k]=v;save();renderTimeline();renderAlibiCheck();renderAlibiMatrix()}"
          if old in s:
              s = s.replace(old, new, 1)
          # 入力中に画面全体を再描画すると、カーソルが外れて1文字ずつしか入力できなくなる。
          # 推理メモなど他の入力欄についても、oninput内のrender呼び出しを外して入力中は再描画しない。
          def clean_oninput(m):
              attr = m.group(1)
              attr = re.sub(r';?\s*render[A-Za-z0-9_]+\([^)]*\)', '', attr)
              return 'oninput="' + attr + '"'
          s = re.sub(r'oninput="([^"]*)"', clean_oninput, s)
          hook = "document.addEventListener('focusout',e=>{if(e.target.matches('input,textarea,select')){setTimeout(()=>{if(e.target.closest('#charactersGrid'))renderCharacters();else renderAll();},0)}});"
          if hook not in s:
              s = s.replace('</script></body></html>', hook + '</script></body></html>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix inference memo input focus'
          git push
