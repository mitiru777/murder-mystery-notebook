name: Patch evidence content toggle

on:
  push:
    paths:
      - '.github/workflows/patch-evidence-content.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add evidence content toggle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* evidence-full-toggle-v1 */'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)
          script = r'''<script>
          /* evidence-full-toggle-v1 */
          (function(){
            function install(){
              if(document.getElementById('evidenceFullToggleStyle')) return;
              var st=document.createElement('style');
              st.id='evidenceFullToggleStyle';
              st.textContent='.evidence-content-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:#fffaf3;color:var(--text);font-weight:800;text-align:left;cursor:pointer}.evidence-content-preview{display:block;white-space:pre-wrap;line-height:1.5;max-height:3.1em;overflow:hidden}.evidence-content-preview.expanded{max-height:none;overflow:visible}.evidence-content-arrow{flex:none;color:var(--muted);font-size:11px}';
              document.head.appendChild(st);
            }
            function enhance(){
              install();
              var candidates=document.querySelectorAll('details');
              candidates.forEach(function(d){
                if(d.dataset.evidenceContentToggle==='1') return;
                var summary=d.querySelector(':scope>summary');
                if(!summary) return;
                var text=(summary.textContent||'').trim();
                if(!/推理|証拠/.test(text)) return;
                var body=d.querySelector(':scope>.detailsbody');
                if(!body) return;
                var labels=Array.from(body.querySelectorAll('label,.ho-title,strong'));
                var contentLabel=labels.find(function(x){return (x.textContent||'').trim()==='内容'});
                if(!contentLabel) return;
                var target=contentLabel.nextElementSibling;
                if(!target) return;
                if(target.dataset.evidenceContentEnhanced==='1') return;
                var raw=(target.value!==undefined?target.value:target.textContent||'').trim();
                if(!raw) return;
                d.dataset.evidenceContentToggle='1';
                target.dataset.evidenceContentEnhanced='1';
                var btn=document.createElement('button');
                btn.type='button';
                btn.className='evidence-content-toggle';
                btn.innerHTML='<span class="evidence-content-preview"></span><span class="evidence-content-arrow">▼</span>';
                var preview=btn.firstElementChild;
                preview.textContent=raw;
                var arrow=btn.lastElementChild;
                btn.addEventListener('click',function(ev){
                  ev.preventDefault();
                  ev.stopPropagation();
                  var open=preview.classList.toggle('expanded');
                  arrow.textContent=open?'▲':'▼';
                });
                target.style.display='none';
                target.parentNode.insertBefore(btn,target.nextSibling);
              });
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',enhance); else enhance();
            new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});
          })();
          </script>'''
          s=s.replace('</body>',script+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: expandable full content for reasoning memos' || exit 0
          git push
