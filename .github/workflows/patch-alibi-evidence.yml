name: Patch alibi matrix and evidence UI
on:
  push:
    paths:
      - '.github/workflows/patch-alibi-evidence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          old_start='function renderAlibiMatrix(){'
          old_end='function renderAlibiCheck(){'
          a=s.find(old_start)
          b=s.find(old_end,a)
          if a<0 or b<0:
              raise SystemExit('renderAlibiMatrix target not found')
          new_matrix=r'''function renderAlibiMatrix(){let box=document.getElementById('alibiMatrix');if(!box)return;let times=[...new Set(current.timeline.map(r=>r.time).filter(Boolean))].sort((a,b)=>timeKey(a)-timeKey(b));let myName=String(current.myHO&&current.myHO.name||'').trim();let names=current.characters.map(c=>c.name).filter(Boolean);if(myName&&!names.includes(myName))names.push(myName);if(!names.length){box.innerHTML='<div class="alibi-empty">キャラクターまたは自分HOを登録してください。</div>';return}if(!times.length){box.innerHTML='<div class="alibi-empty">時刻が登録された時系列がまだありません。</div>';return}let html='<div class="alibi-title">時間帯×全員 アリバイ表</div><div class="hint">自分HOも含め、各時間にその人物がいた場所・出来事を確認できます。</div><div class="tablewrap" style="margin-top:8px"><table class="alibi-check-table alibi-matrix"><thead><tr><th>時間</th>'+names.map(n=>'<th>'+personHtml(n)+(n===myName?'<span class="badge" style="margin-left:5px">自分HO</span>':'')+'</th>').join('')+'</tr></thead><tbody>';times.forEach(t=>{html+='<tr><th>'+esc(t)+'</th>';names.forEach(n=>{let rows=current.timeline.filter(r=>r.time===t&&(r.peopleNames||[]).includes(n));if(!rows.length){html+='<td class="matrix-none" style="background:#fff1f1;color:#b34d55;font-weight:800">アリバイなし</td>';return}html+='<td>'+rows.map(r=>'<div><b>'+esc(r.place||'場所不明')+'</b><div class="mini">'+esc(r.event||'未記録')+'</div></div>').join('<hr style="border:0;border-top:1px solid var(--line);margin:5px 0">')+'</td>'});html+='</tr>'});html+='</tbody></table></div>';box.innerHTML=html}'''
          s=s[:a]+new_matrix+s[b:]

          start='function renderEvidence(){'
          end='function editE('
          a=s.find(start)
          b=s.find(end,a)
          if a<0 or b<0:
              raise SystemExit('renderEvidence target not found')
          new_evidence=r'''function renderEvidence(){let g=document.getElementById('evidenceList');g.innerHTML='';if(!current.evidence.length){g.innerHTML='<div class="empty">「＋ メモを追加」から追加してください。</div>';return}current.evidence.forEach((e,i)=>{let d=document.createElement('details');d.open=!!e.open;d.ontoggle=()=>{e.open=d.open;save()};d.innerHTML=`<summary><span class="badge">${esc(e.type)}</span> ${esc(e.title)} <span class="hint" style="float:right">タップで開閉</span></summary><div class="detailsbody"><input value="${esc(e.title)}" oninput="editE(${i},'title',this.value)"><label>種類</label><select onchange="editE(${i},'type',this.value)">${['証拠','発言','推理','疑問','その他'].map(x=>`<option ${x===e.type?'selected':''}>${x}</option>`).join('')}</select><label>内容</label><textarea oninput="editE(${i},'content',this.value)">${esc(e.content)}</textarea><label>関連人物・場所・時刻</label><input value="${esc(e.related)}" oninput="editE(${i},'related',this.value)"><label>情報源</label><input value="${esc(e.source)}" oninput="editE(${i},'source',this.value)"><label>確度</label><input value="${esc(e.certainty)}" oninput="editE(${i},'certainty',this.value)"><button class="danger" onclick="current.evidence.splice(${i},1);save();renderEvidence()">削除</button></div>`;g.appendChild(d)})}'''
          s=s[:a]+new_evidence+s[b:]

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m '強化: 自分HOを含む時間別アリバイ表と証拠の開閉表示'
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/patch-alibi-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/patch-alibi-evidence.yml
          git commit -m 'Remove temporary patch workflow'
          git push
